<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="100%" height="100%" style="max-width: 520px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #ffffff; border-radius: 8px;">
  <defs>
    <marker id="arr-axis-5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Coordinate Grid -->
  <g opacity="0.6">
    <line x1="50" y1="30" x2="50" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="75" y1="30" x2="75" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="100" y1="30" x2="100" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="125" y1="30" x2="125" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="150" y1="30" x2="150" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="175" y1="30" x2="175" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="200" y1="30" x2="200" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="225" y1="30" x2="225" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="250" y1="30" x2="250" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="275" y1="30" x2="275" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="300" y1="30" x2="300" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="325" y1="30" x2="325" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="350" y1="30" x2="350" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="375" y1="30" x2="375" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="400" y1="30" x2="400" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="425" y1="30" x2="425" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="450" y1="30" x2="450" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="475" y1="30" x2="475" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="30" x2="480" y2="30" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="55" x2="480" y2="55" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="80" x2="480" y2="80" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="105" x2="480" y2="105" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="130" x2="480" y2="130" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="155" x2="480" y2="155" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="180" x2="480" y2="180" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="205" x2="480" y2="205" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="230" x2="480" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
  </g>

  <!-- Axes -->
  <!-- Y-axis -->
  <line x1="60" y1="240" x2="60" y2="25" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-axis-5)"/>
  <text x="50" y="22" font-size="14" font-weight="600" fill="#1e293b" font-style="italic">φ(x)</text>

  <!-- X-axis -->
  <line x1="50" y1="230" x2="485" y2="230" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-axis-5)"/>
  <text x="490" y="235" font-size="14" font-weight="600" fill="#1e293b" font-style="italic">x</text>
  <text x="48" y="246" font-size="13" fill="#64748b">0</text>

  <!-- Distribution curve (Right-skewed curve) -->
  <path d="M 60 230 C 100 230, 130 190, 150 110 C 165 50, 185 50, 200 80 C 230 140, 280 215, 430 228 L 470 230" 
        fill="none" stroke="#0070c0" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Vertical marker lines for Mo, Me, M(X) -->
  <!-- Mo (Mode - peak of curve at x ≈ 175) -->
  <line x1="175" y1="58" x2="175" y2="230" stroke="#ff5050" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="175" cy="58" r="4.5" fill="#ff5050"/>
  <circle cx="175" cy="230" r="3.5" fill="#ff5050"/>
  <text x="175" y="248" font-size="14" font-weight="bold" fill="#ff5050" text-anchor="middle">Mo</text>
  <text x="175" y="45" font-size="12" font-weight="600" fill="#ff5050" text-anchor="middle">Мода (вершина)</text>

  <!-- Me (Median at x ≈ 205) -->
  <line x1="205" y1="88" x2="205" y2="230" stroke="#10b981" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="205" cy="88" r="4.5" fill="#10b981"/>
  <circle cx="205" cy="230" r="3.5" fill="#10b981"/>
  <text x="205" y="248" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">Me</text>
  <text x="215" y="78" font-size="12" font-weight="600" fill="#10b981" text-anchor="start">Медиана</text>

  <!-- M(X) (Expected Value at x ≈ 240) -->
  <line x1="240" y1="135" x2="240" y2="230" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="240" cy="135" r="4.5" fill="#8b5cf6"/>
  <circle cx="240" cy="230" r="3.5" fill="#8b5cf6"/>
  <text x="245" y="248" font-size="14" font-weight="bold" fill="#8b5cf6" text-anchor="middle">M(X)</text>
  <text x="250" y="125" font-size="12" font-weight="600" fill="#8b5cf6" text-anchor="start">Мат. ожидание (центр масс)</text>
</svg>