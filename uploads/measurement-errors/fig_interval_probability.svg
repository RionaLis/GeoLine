  <text x="360" y="166" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">S = P(x₁ &lt; X &lt; x₂)</text>
  <text x="360" y="180" font-size="11" font-weight="bold" fill="#075c52" text-anchor="middle">= Ф₀(t₂) − Ф₀(t₁)</text>
