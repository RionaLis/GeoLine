<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="100%" height="100%" style="max-width: 760px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0;">
  <defs>
    <marker id="cnt-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="cnt-arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Coordinate Grid -->
  <g opacity="0.4">
    <line x1="50" y1="50" x2="710" y2="50" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="50" y1="100" x2="710" y2="100" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="50" y1="150" x2="710" y2="150" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="50" y1="200" x2="710" y2="200" stroke="#cbd5e1" stroke-width="0.8"/>
  </g>

  <!-- Title / Legend banner -->
  <rect x="50" y="12" width="660" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="32" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">
    Процесс центрирования: параллельный перенос начала отсчёта в точку математического ожидания
  </text>

  <!-- Main Horizontal Axis (X) -->
  <line x1="50" y1="220" x2="720" y2="220" stroke="#1e293b" stroke-width="2" marker-end="url(#cnt-arr)"/>
  <text x="725" y="224" font-size="14" font-weight="bold" fill="#1e293b" font-style="italic">X</text>

  <!-- Coordinate 0 -->
  <line x1="160" y1="213" x2="160" y2="227" stroke="#1e293b" stroke-width="2"/>
  <text x="160" y="244" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">0</text>
  <text x="160" y="259" font-size="11" fill="#64748b" text-anchor="middle">(старое начало)</text>

  <!-- Position of M(X) = 520 (offset = +360 px) -->
  <line x1="520" y1="48" x2="520" y2="227" stroke="#0070c0" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="520" cy="220" r="5" fill="#0070c0"/>
  <text x="520" y="244" font-size="13" font-weight="bold" fill="#0070c0" text-anchor="middle">M(X)</text>
  <text x="520" y="259" font-size="11" fill="#0284c7" text-anchor="middle">математическое ожидание</text>

  <!-- The Animated Group: Centering Shift from X = 520 to X = 160 -->
  <g id="animated-bell">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 0,0; -360,0; -360,0; 0,0" 
      keyTimes="0; 0.25; 0.65; 0.85; 1" 
      dur="7s" 
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1" />

    <!-- Gaussian Curve centered at x=520 (height = 140, base from 380 to 660) -->
    <!-- Gradient Fill -->
    <path d="M 380 220 C 450 220, 480 80, 520 80 C 560 80, 590 220, 660 220 Z" 
          fill="#38bdf8" opacity="0.25"/>
    <path d="M 380 220 C 450 220, 480 80, 520 80 C 560 80, 590 220, 660 220" 
          fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

    <!-- Center vertical bar in curve -->
    <line x1="520" y1="80" x2="520" y2="220" stroke="#0284c7" stroke-width="2"/>
    <circle cx="520" cy="80" r="4" fill="#0284c7"/>

    <!-- Dynamic Status Badge that moves with curve -->
    <rect x="440" y="52" width="160" height="24" rx="4" fill="#0284c7"/>
    <text x="520" y="68" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Кривая распределения</text>
  </g>

  <!-- Shift vector arrow at the top -->
  <g>
    <!-- Arrow showing shift to the left: -M(X) -->
    <path d="M 500 130 L 200 130" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#cnt-arr)"/>
    <rect x="290" y="112" width="140" height="22" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="360" y="127" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Сдвиг на −M(X)</text>
  </g>

  <!-- Fixed Zero Axis line for Centered Value X° -->
  <line x1="160" y1="60" x2="160" y2="220" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="160" y="52" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">M(X°) = 0</text>

  <!-- Explanatory note in box at bottom -->
  <rect x="230" y="165" width="290" height="34" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="375" y="186" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">
    Центрированная величина:  X° = X − M(X)
  </text>
</svg>