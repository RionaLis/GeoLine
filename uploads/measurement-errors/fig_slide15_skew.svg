<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="100%" height="100%" style="max-width: 840px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #ffffff; border-radius: 8px;">
  <defs>
    <marker id="arr-axis-15" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- 3 Panels: Left (Sk < 0), Center (Sk = 0), Right (Sk > 0) -->

  <!-- ================= PANEL 1: Sk < 0 (Левосторонняя асимметрия) ================= -->
  <g transform="translate(10, 10)">
    <!-- Grid -->
    <g opacity="0.5">
      <line x1="30" y1="20" x2="30" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="52" y1="20" x2="52" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="74" y1="20" x2="74" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="96" y1="20" x2="96" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="118" y1="20" x2="118" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="140" y1="20" x2="140" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="162" y1="20" x2="162" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="184" y1="20" x2="184" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="206" y1="20" x2="206" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="228" y1="20" x2="228" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="250" y1="20" x2="250" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="20" x2="250" y2="20" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="42" x2="250" y2="42" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="64" x2="250" y2="64" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="86" x2="250" y2="86" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="108" x2="250" y2="108" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="130" x2="250" y2="130" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="152" x2="250" y2="152" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="174" x2="250" y2="174" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="196" x2="250" y2="196" stroke="#e2e8f0" stroke-width="0.8"/>
    </g>
    <!-- Axes -->
    <line x1="40" y1="210" x2="40" y2="15" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr-axis-15)"/>
    <text x="30" y="14" font-size="12" font-style="italic" fill="#1e293b">φ(x)</text>
    <line x1="30" y1="200" x2="250" y2="200" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr-axis-15)"/>
    <text x="254" y="204" font-size="12" font-style="italic" fill="#1e293b">x</text>

    <!-- Left-skewed curve (tail stretches to the left, peak is on the right) -->
    <path d="M 45 198 C 90 198, 130 180, 160 120 C 180 60, 200 60, 215 110 C 225 150, 235 190, 245 200" 
          fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Peak Mo at x ≈ 195 -->
    <line x1="195" y1="65" x2="195" y2="200" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="195" cy="65" r="3.5" fill="#dc2626"/>
    <text x="195" y="214" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Mo</text>

    <!-- Median Me at x ≈ 170 -->
    <line x1="170" y1="95" x2="170" y2="200" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="170" y="214" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">Me</text>

    <!-- M(X) at x ≈ 140 -->
    <line x1="140" y1="150" x2="140" y2="200" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="140" y="214" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">M(X)</text>

    <text x="140" y="238" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">Sk &lt; 0 (левосторонняя)</text>
    <text x="140" y="252" font-size="11" fill="#475569" text-anchor="middle">M(X) &lt; Me &lt; Mo</text>
  </g>

  <!-- ================= PANEL 2: Sk = 0 (Симметричное распределение) ================= -->
  <g transform="translate(290, 10)">
    <!-- Grid -->
    <g opacity="0.5">
      <line x1="30" y1="20" x2="30" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="52" y1="20" x2="52" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="74" y1="20" x2="74" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="96" y1="20" x2="96" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="118" y1="20" x2="118" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="140" y1="20" x2="140" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="162" y1="20" x2="162" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="184" y1="20" x2="184" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="206" y1="20" x2="206" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="228" y1="20" x2="228" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="250" y1="20" x2="250" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="20" x2="250" y2="20" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="42" x2="250" y2="42" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="64" x2="250" y2="64" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="86" x2="250" y2="86" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="108" x2="250" y2="108" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="130" x2="250" y2="130" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="152" x2="250" y2="152" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="174" x2="250" y2="174" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="196" x2="250" y2="196" stroke="#e2e8f0" stroke-width="0.8"/>
    </g>
    <!-- Axes -->
    <line x1="40" y1="210" x2="40" y2="15" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr-axis-15)"/>
    <text x="30" y="14" font-size="12" font-style="italic" fill="#1e293b">φ(x)</text>
    <line x1="30" y1="200" x2="250" y2="200" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr-axis-15)"/>
    <text x="254" y="204" font-size="12" font-style="italic" fill="#1e293b">x</text>

    <!-- Symmetric bell curve -->
    <path d="M 45 200 C 85 200, 115 160, 130 110 C 140 60, 150 60, 160 110 C 175 160, 205 200, 245 200" 
          fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Central point Mo = Me = M(X) at x = 145 -->
    <line x1="145" y1="62" x2="145" y2="200" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="145" cy="62" r="3.5" fill="#16a34a"/>
    <text x="145" y="214" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">Mo = Me = M(X)</text>

    <text x="145" y="238" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">Sk = 0 (симметричное)</text>
    <text x="145" y="252" font-size="11" fill="#475569" text-anchor="middle">Нормальный закон Гаусса</text>
  </g>

  <!-- ================= PANEL 3: Sk > 0 (Правосторонняя асимметрия) ================= -->
  <g transform="translate(570, 10)">
    <!-- Grid -->
    <g opacity="0.5">
      <line x1="30" y1="20" x2="30" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="52" y1="20" x2="52" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="74" y1="20" x2="74" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="96" y1="20" x2="96" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="118" y1="20" x2="118" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="140" y1="20" x2="140" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="162" y1="20" x2="162" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="184" y1="20" x2="184" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="206" y1="20" x2="206" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="228" y1="20" x2="228" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="250" y1="20" x2="250" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="20" x2="250" y2="20" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="42" x2="250" y2="42" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="64" x2="250" y2="64" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="86" x2="250" y2="86" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="108" x2="250" y2="108" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="130" x2="250" y2="130" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="152" x2="250" y2="152" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="174" x2="250" y2="174" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="30" y1="196" x2="250" y2="196" stroke="#e2e8f0" stroke-width="0.8"/>
    </g>
    <!-- Axes -->
    <line x1="40" y1="210" x2="40" y2="15" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr-axis-15)"/>
    <text x="30" y="14" font-size="12" font-style="italic" fill="#1e293b">φ(x)</text>
    <line x1="30" y1="200" x2="250" y2="200" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr-axis-15)"/>
    <text x="254" y="204" font-size="12" font-style="italic" fill="#1e293b">x</text>

    <!-- Right-skewed curve (tail stretches to the right, peak is on the left) -->
    <path d="M 45 200 C 65 190, 75 140, 85 95 C 100 55, 115 55, 130 110 C 155 160, 200 198, 245 198" 
          fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Peak Mo at x ≈ 98 -->
    <line x1="98" y1="60" x2="98" y2="200" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="98" cy="60" r="3.5" fill="#dc2626"/>
    <text x="98" y="214" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Mo</text>

    <!-- Median Me at x ≈ 120 -->
    <line x1="120" y1="88" x2="120" y2="200" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="120" y="214" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">Me</text>

    <!-- M(X) at x ≈ 150 -->
    <line x1="150" y1="145" x2="150" y2="200" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="150" y="214" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">M(X)</text>

    <text x="140" y="238" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">Sk &gt; 0 (правосторонняя)</text>
    <text x="140" y="252" font-size="11" fill="#475569" text-anchor="middle">Mo &lt; Me &lt; M(X)</text>
  </g>
</svg>