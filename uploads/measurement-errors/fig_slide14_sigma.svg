<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%" style="max-width: 640px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #ffffff; border-radius: 8px;">
  <defs>
    <marker id="arr-axis-14" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Coordinate Grid -->
  <g opacity="0.6">
    <line x1="50" y1="30" x2="50" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="75" y1="30" x2="75" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="100" y1="30" x2="100" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="125" y1="30" x2="125" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="150" y1="30" x2="150" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="175" y1="30" x2="175" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="200" y1="30" x2="200" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="225" y1="30" x2="225" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="250" y1="30" x2="250" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="275" y1="30" x2="275" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="300" y1="30" x2="300" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="325" y1="30" x2="325" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="350" y1="30" x2="350" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="375" y1="30" x2="375" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="400" y1="30" x2="400" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="425" y1="30" x2="425" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="450" y1="30" x2="450" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="475" y1="30" x2="475" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="500" y1="30" x2="500" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="525" y1="30" x2="525" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="550" y1="30" x2="550" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="575" y1="30" x2="575" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="600" y1="30" x2="600" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="30" x2="610" y2="30" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="55" x2="610" y2="55" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="80" x2="610" y2="80" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="105" x2="610" y2="105" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="130" x2="610" y2="130" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="155" x2="610" y2="155" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="180" x2="610" y2="180" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="205" x2="610" y2="205" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="230" x2="610" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="255" x2="610" y2="255" stroke="#e2e8f0" stroke-width="0.8"/>
  </g>

  <!-- Axes -->
  <line x1="60" y1="280" x2="60" y2="25" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-axis-14)"/>
  <text x="50" y="20" font-size="14" font-weight="bold" fill="#1e293b" font-style="italic">φ(x)</text>

  <line x1="50" y1="270" x2="600" y2="270" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-axis-14)"/>
  <text x="605" y="274" font-size="14" font-weight="bold" fill="#1e293b" font-style="italic">x</text>

  <!-- Center M(X) = 320 -->
  <line x1="320" y1="35" x2="320" y2="270" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="320" y="288" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">M(X)</text>

  <!-- Curve 1: High precision (small sigma1), sharp tall bell -->
  <!-- Peak at (320, 45) -->
  <path d="M 170 270 C 240 270, 275 220, 295 140 C 310 70, 315 45, 320 45 C 325 45, 330 70, 345 140 C 365 220, 400 270, 470 270" 
        fill="none" stroke="#0284c7" stroke-width="2.8"/>
  <text x="325" y="40" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="start">σ₁ (высокая точность)</text>

  <!-- Curve 2: Low precision (large sigma2), wide flat bell -->
  <!-- Peak at (320, 150) -->
  <path d="M 90 270 C 180 270, 230 220, 270 180 C 300 155, 310 150, 320 150 C 330 150, 340 155, 370 180 C 410 220, 460 270, 550 270" 
        fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <text x="440" y="170" font-size="12" font-weight="bold" fill="#ea580c">σ₂ (низкая точность)</text>

  <!-- Corridors -->
  <!-- sigma 1 corridor: +/- 40 px -->
  <line x1="280" y1="135" x2="280" y2="270" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="360" y1="135" x2="360" y2="270" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="280" y1="230" x2="360" y2="230" stroke="#0284c7" stroke-width="1.8"/>
  <circle cx="280" cy="230" r="3" fill="#0284c7"/>
  <circle cx="360" cy="230" r="3" fill="#0284c7"/>
  <text x="320" y="222" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">±σ₁</text>

  <!-- sigma 2 corridor: +/- 85 px -->
  <line x1="235" y1="210" x2="235" y2="270" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="405" y1="210" x2="405" y2="270" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="235" y1="250" x2="405" y2="250" stroke="#ea580c" stroke-width="1.8"/>
  <circle cx="235" cy="250" r="3" fill="#ea580c"/>
  <circle cx="405" cy="250" r="3" fill="#ea580c"/>
  <text x="415" y="254" font-size="12" font-weight="bold" fill="#ea580c">±σ₂</text>

  <!-- Legend / formula -->
  <rect x="75" y="40" width="180" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="85" y="58" font-size="12" font-weight="bold" fill="#1e293b">σ₁ &lt; σ₂</text>
  <text x="85" y="74" font-size="11" fill="#475569">Чем меньше σ, тем выше кучность</text>
</svg>