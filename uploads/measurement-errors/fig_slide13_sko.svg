<line x1="325" y1="25" x2="325" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="350" y1="25" x2="350" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="375" y1="25" x2="375" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="400" y1="25" x2="400" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="425" y1="25" x2="425" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="450" y1="25" x2="450" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="475" y1="25" x2="475" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="500" y1="25" x2="500" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="25" x2="510" y2="25" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="50" x2="510" y2="50" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="75" x2="510" y2="75" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="100" x2="510" y2="100" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="125" x2="510" y2="125" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="150" x2="510" y2="150" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="175" x2="510" y2="175" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="200" x2="510" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="225" x2="510" y2="225" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="250" x2="510" y2="250" stroke="#e2e8f0" stroke-width="0.8"/>
  </g>

  <!-- Corridors -->
  <!-- Corridor +/- sigma -->
  <rect x="65" y="93" width="445" height="104" fill="#0284c7" opacity="0.08"/>
  <line x1="65" y1="93" x2="510" y2="93" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="6,4"/>
  <line x1="65" y1="197" x2="510" y2="197" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="6,4"/>

  <!-- Corridor +/- delta_bar (mean absolute deviation) inside sigma -->
  <line x1="65" y1="104" x2="510" y2="104" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="65" y1="186" x2="510" y2="186" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4,3"/>

  <!-- M(X) horizontal line -->
  <line x1="65" y1="145" x2="510" y2="145" stroke="#0070c0" stroke-width="2.2"/>

  <!-- Axes -->
  <!-- Y-axis (X / Value) -->
  <line x1="65" y1="275" x2="65" y2="25" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-axis-13)"/>
  <text x="52" y="20" font-size="14" font-weight="bold" fill="#1e293b" font-style="italic">X</text>

  <!-- X-axis (i / Measurement index) -->
  <line x1="55" y1="270" x2="520" y2="270" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-axis-13)"/>
  <text x="525" y="274" font-size="14" font-weight="bold" fill="#1e293b" font-style="italic">i</text>
  <text x="50" y="284" font-size="12" fill="#64748b">0</text>

  <!-- Labels on the Y-axis -->
  <!-- +sigma -->
  <line x1="60" y1="93" x2="70" y2="93" stroke="#0284c7" stroke-width="2"/>
  <text x="56" y="97" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">+σ</text>

  <!-- +delta_bar -->
  <line x1="60" y1="104" x2="70" y2="104" stroke="#10b981" stroke-width="2"/>
  <text x="56" y="108" font-size="12" font-weight="bold" fill="#10b981" text-anchor="end">+Δ̄</text>

  <!-- M(X) -->
  <line x1="60" y1="145" x2="70" y2="145" stroke="#0070c0" stroke-width="2"/>
  <text x="56" y="149" font-size="12" font-weight="bold" fill="#0070c0" text-anchor="end">M(X)</text>

  <!-- -delta_bar -->
  <line x1="60" y1="186" x2="70" y2="186" stroke="#10b981" stroke-width="2"/>
  <text x="56" y="190" font-size="12" font-weight="bold" fill="#10b981" text-anchor="end">-Δ̄</text>

  <!-- -sigma -->
  <line x1="60" y1="197" x2="70" y2="197" stroke="#0284c7" stroke-width="2"/>
  <text x="56" y="201" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">-σ</text>

  <!-- Measurement polyline -->
  <polyline points="80,205 120,105 160,175 200,75 240,185 280,110 320,215 360,95 400,160 440,80 480,170" fill="none" stroke="#ff5050" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="80" cy="205" r="4" fill="#ff5050"/>
<circle cx="120" cy="105" r="4" fill="#ff5050"/>
<circle cx="160" cy="175" r="4" fill="#ff5050"/>
<circle cx="200" cy="75" r="4" fill="#ff5050"/>
<circle cx="240" cy="185" r="4" fill="#ff5050"/>
<circle cx="280" cy="110" r="4" fill="#ff5050"/>
<circle cx="320" cy="215" r="4" fill="#ff5050"/>
<circle cx="360" cy="95" r="4" fill="#ff5050"/>
<circle cx="400" cy="160" r="4" fill="#ff5050"/>
<circle cx="440" cy="80" r="4" fill="#ff5050"/>
<circle cx="480" cy="170" r="4" fill="#ff5050"/>

  <!-- Compact Legend at top right -->
  <rect x="330" y="30" width="175" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" opacity="0.95"/>
  <line x1="338" y1="42" x2="362" y2="42" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="368" y="46" font-size="11" font-weight="bold" fill="#0284c7">Полоса СКО (±σ)</text>
  <line x1="338" y1="60" x2="362" y2="60" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="368" y="64" font-size="11" font-weight="bold" fill="#10b981">Ср. абсолютн. (±Δ̄)</text>
</svg>