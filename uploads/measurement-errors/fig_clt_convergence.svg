<line x1="50" y1="275" x2="610" y2="275" stroke="#e2e8f0" stroke-width="0.8"/></g>
  
  <!-- Y-axis -->
  <line x1="60" y1="270" x2="60" y2="25" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-clt)"/>
  <text x="50" y="20" font-size="14" font-weight="bold" fill="#1e293b" font-style="italic">φ(x)</text>

  <!-- X-axis -->
  <line x1="50" y1="260" x2="605" y2="260" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-clt)"/>
  <text x="610" y="264" font-size="14" font-weight="bold" fill="#1e293b" font-style="italic">x</text>

  <!-- 1. n = 1: Uniform distribution (flat box) -->
  <rect x="220" y="210" width="200" height="50" fill="#94a3b8" opacity="0.2" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="430" y="225" font-size="11" font-weight="bold" fill="#64748b">n = 1 (равномерное)</text>

  <!-- 2. n = 2: Simpson triangle -->
  <polygon points="170,260 320,150 470,260" fill="#f59e0b" opacity="0.2" stroke="#d97706" stroke-width="2.2"/>
  <text x="450" y="180" font-size="11" font-weight="bold" fill="#d97706">n = 2 (треугольное)</text>

  <!-- 3. n >= 4: Gaussian bell -->
  <path d="M 120 260 C 200 260, 260 210, 290 140 C 310 70, 320 50, 320 50 C 320 50, 330 70, 350 140 C 380 210, 440 260, 520 260" 
        fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <text x="325" y="45" font-size="12" font-weight="bold" fill="#0284c7">n ≥ 4 (теорема Ляпунова, Гаусс)</text>

  <!-- Center line -->
  <line x1="320" y1="50" x2="320" y2="260" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="320" y="278" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">M(∑ Xᵢ)</text>
</svg>