<line x1="275" y1="25" x2="275" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="300" y1="25" x2="300" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="325" y1="25" x2="325" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="350" y1="25" x2="350" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="375" y1="25" x2="375" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="400" y1="25" x2="400" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="425" y1="25" x2="425" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="450" y1="25" x2="450" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="475" y1="25" x2="475" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
