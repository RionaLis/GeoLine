<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%" style="max-width:640px;font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;background:#ffffff;border-radius:8px;">
  <defs>
    <marker id="arr-clt" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>
  <g opacity="0.6"><line x1="50" y1="25" x2="50" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="75" y1="25" x2="75" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
