<line x1="50" y1="175" x2="610" y2="175" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="200" x2="610" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="225" x2="610" y2="225" stroke="#e2e8f0" stroke-width="0.8"/>
