<line x1="150" y1="25" x2="150" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="175" y1="25" x2="175" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="200" y1="25" x2="200" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="225" y1="25" x2="225" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="250" y1="25" x2="250" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="275" y1="25" x2="275" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="300" y1="25" x2="300" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="325" y1="25" x2="325" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="350" y1="25" x2="350" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="375" y1="25" x2="375" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="400" y1="25" x2="400" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="425" y1="25" x2="425" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="450" y1="25" x2="450" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="475" y1="25" x2="475" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="500" y1="25" x2="500" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="525" y1="25" x2="525" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="550" y1="25" x2="550" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="575" y1="25" x2="575" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="600" y1="25" x2="600" y2="275" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="25" x2="610" y2="25" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="50" x2="610" y2="50" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="75" x2="610" y2="75" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="100" x2="610" y2="100" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="125" x2="610" y2="125" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="150" x2="610" y2="150" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="175" x2="610" y2="175" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="200" x2="610" y2="200" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="225" x2="610" y2="225" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="250" x2="610" y2="250" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="50" y1="275" x2="610" y2="275" stroke="#e2e8f0" stroke-width="0.8"/></g>
  
  <!-- Y-axis -->
  <line x1="320" y1="270" x2="320" y2="25" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-std)"/>
  <text x="310" y="20" font-size="14" font-weight="bold" fill="#1e293b" font-style="italic">φ(t)</text>

  <!-- X-axis -->
  <line x1="50" y1="260" x2="605" y2="260" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-std)"/>
  <text x="610" y="264" font-size="14" font-weight="bold" fill="#1e293b" font-style="italic">t</text>
  <text x="320" y="278" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">0</text>

  <!-- Bell Curve N(0, 1) -->
  <path d="M 120 260 C 200 260, 250 200, 280 140 C 305 75, 320 55, 320 55 C 320 55, 335 75, 360 140 C 390 200, 440 260, 520 260" 
        fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

  <!-- Peak value 1/sqrt(2pi) approx 0.3989 -->
  <line x1="312" y1="55" x2="328" y2="55" stroke="#0284c7" stroke-width="2"/>
  <text x="334" y="60" font-size="12" font-weight="bold" fill="#0284c7">1/√(2π) ≈ 0.399</text>

  <!-- Inflection points at t = -1 and +1 -->
  <!-- t = -1 (x = 240), t = +1 (x = 400) -->
  <line x1="240" y1="135" x2="240" y2="260" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="400" y1="135" x2="400" y2="260" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="240" cy="135" r="4" fill="#10b981"/>
  <circle cx="400" cy="135" r="4" fill="#10b981"/>
  <text x="240" y="278" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">−1 (точка перегиба)</text>
  <text x="400" y="278" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">+1 (точка перегиба)</text>

  <!-- Legend box -->
  <rect x="65" y="35" width="220" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="75" y="54" font-size="12" font-weight="bold" fill="#1e293b">Стандартная величина:</text>
  <text x="75" y="72" font-size="11" fill="#0284c7">T = (X − M(X)) / σ ~ N(0, 1)</text>
</svg>