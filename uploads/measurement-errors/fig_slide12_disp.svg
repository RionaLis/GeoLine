<line x1="190" y1="30" x2="190" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="215" y1="30" x2="215" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="240" y1="30" x2="240" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="265" y1="30" x2="265" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="290" y1="30" x2="290" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
