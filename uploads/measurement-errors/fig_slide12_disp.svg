<line x1="415" y1="30" x2="415" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="440" y1="30" x2="440" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="465" y1="30" x2="465" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="490" y1="30" x2="490" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="40" y1="30" x2="510" y2="30" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="40" y1="55" x2="510" y2="55" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="40" y1="80" x2="510" y2="80" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="40" y1="105" x2="510" y2="105" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="40" y1="130" x2="510" y2="130" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="40" y1="155" x2="510" y2="155" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="40" y1="180" x2="510" y2="180" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="40" y1="205" x2="510" y2="205" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="40" y1="230" x2="510" y2="230" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="40" y1="255" x2="510" y2="255" stroke="#e2e8f0" stroke-width="0.8"/>
  </g>

  <!-- Coordinate Axes -->
  <!-- Y-axis (X / Value) -->
  <line x1="55" y1="275" x2="55" y2="25" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-axis-disp)"/>
  <text x="45" y="20" font-size="14" font-weight="bold" fill="#1e293b" font-style="italic">X</text>

  <!-- X-axis (i / Measurement index) -->
  <line x1="45" y1="270" x2="515" y2="270" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-axis-disp)"/>
  <text x="520" y="274" font-size="14" font-weight="bold" fill="#1e293b" font-style="italic">i</text>
  <text x="40" y="284" font-size="12" fill="#64748b">0</text>

  <!-- M(X) line -->
  <line x1="55" y1="145" x2="505" y2="145" stroke="#0070c0" stroke-width="2.2"/>
  <text x="510" y="149" font-size="13" font-weight="bold" fill="#0070c0">M(X)</text>


  <!-- Corridor D(X) -->
  <line x1="55" y1="85" x2="505" y2="85" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="55" y1="205" x2="505" y2="205" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="510" y="89" font-size="12" font-weight="bold" fill="#8b5cf6">+D(X)</text>
  <text x="510" y="209" font-size="12" font-weight="bold" fill="#8b5cf6">-D(X)</text>
  <rect x="55" y="85" width="450" height="120" fill="#8b5cf6" opacity="0.08"/>

<polyline points="80,205 120,105 160,175 200,75 240,185 280,110 320,215 360,95 400,160 440,80 480,170" fill="none" stroke="#ff5050" stroke-width="2" stroke-linejoin="round"/>
<circle cx="80" cy="205" r="4" fill="#ff5050"/>
<circle cx="120" cy="105" r="4" fill="#ff5050"/>
<circle cx="160" cy="175" r="4" fill="#ff5050"/>
<circle cx="200" cy="75" r="4" fill="#ff5050"/>
<circle cx="240" cy="185" r="4" fill="#ff5050"/>
<circle cx="280" cy="110" r="4" fill="#ff5050"/>
<circle cx="320" cy="215" r="4" fill="#ff5050"/>
<circle cx="360" cy="95" r="4" fill="#ff5050"/>
<circle cx="400" cy="160" r="4" fill="#ff5050"/>
<circle cx="440" cy="80" r="4" fill="#ff5050"/>
<circle cx="480" cy="170" r="4" fill="#ff5050"/>

  <rect x="230" y="35" width="265" height="48" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="240" y="55" font-size="12" font-weight="bold" fill="#5b21b6">Дисперсия (квадратная размерность):</text>
  <text x="240" y="72" font-size="12" font-weight="600" fill="#6d28d9">D(X) = M[(X - M(X))²] = Σ Δᵢ² / n</text>

</svg>