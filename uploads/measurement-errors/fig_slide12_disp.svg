<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" width="100%" height="100%" style="max-width: 540px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #ffffff; border-radius: 8px;">
  <defs>
    <marker id="arr-axis-disp" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-err-up-disp" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 7 L 5 0 L 10 7 z" fill="#10b981"/>
    </marker>
    <marker id="arr-err-down-disp" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 3 L 5 10 L 10 3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-double-disp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 5 L 8 5" stroke="#10b981" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Coordinate Grid -->
  <g opacity="0.6">
    <line x1="40" y1="30" x2="40" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
<line x1="65" y1="30" x2="65" y2="270" stroke="#e2e8f0" stroke-width="0.8"/>
